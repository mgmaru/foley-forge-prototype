# Phase 0 代表プロンプト集（docs/phases/phase0/README.md §8）
#
# 構造: 源 + 動作 + 特性 + 品質 + ネガティブ（FF-D010）
# - prompt はドラフト。spike で調整する変数。
# - 全モデルに「同一セット」を当てる（モデル比較の公平性）。
# - prompt は英語（モデルが Freesound 英語キャプションで学習）。scene_ja は人間用ラベル。
# - tier: body  = カバー率の母数 N=6（§8.1）
#         diagnostic = デザインSE/非現実音。本体カバー率に入れず別報告（§8.1 昇格ルール）
# - negative_prompt の効きはモデル依存（Stable Audio Open / AudioLDM2 は対応、他は要確認）。
prompts:
  # ── 本体（カバー率の母数 N=6）──
  - id: env_rain_forest
    idx: 1
    scene_ja: 雨の森（静かな雨＋木々のざわめき）
    source: 環境音
    temporal: 環境
    tier: body
    prompt: "gentle rain falling in a quiet forest, soft raindrops on leaves, distant trees rustling in a light breeze, calm natural ambience, field recording"
    negative_prompt: "music, speech, voice, distortion, clipping"

  - id: env_city_night
    idx: 2
    scene_ja: 夜の街の喧騒（遠くの車・人のざわめき）
    source: 環境音
    temporal: 環境
    tier: body
    prompt: "nighttime city street ambience, distant cars passing, faint crowd murmur, occasional far-off horn, quiet urban night atmosphere, field recording"
    negative_prompt: "music, clear speech, distortion, clipping"

  - id: foley_run_dirt
    idx: 3
    scene_ja: 土の上を走る足音
    source: フォーリー
    temporal: 継続
    tier: body
    prompt: "footsteps running on dirt and gravel, fast rhythmic steps of a single person sprinting outdoors, dry close foley recording"
    negative_prompt: "music, speech, heavy reverb, distortion, clipping"

  - id: foley_cloth_turn
    idx: 4
    scene_ja: 振り向く時の衣擦れ
    source: フォーリー
    temporal: 単発
    tier: body
    prompt: "quick cloth rustle as a person turns, fabric swish of clothing in a single short movement, subtle close foley recording"
    negative_prompt: "music, speech, loud impact, distortion"

  - id: hardfx_sword_clash
    idx: 5
    scene_ja: 剣の金属衝突
    source: ハードFX
    temporal: 単発
    tier: body
    prompt: "two metal swords clashing, sharp metallic impact with a bright ringing tail, single forceful blade strike, cinematic"
    negative_prompt: "music, speech, muffled, distortion, clipping"

  - id: hardfx_explosion_distant
    idx: 6
    scene_ja: 爆発（遠距離の轟音）
    source: ハードFX
    temporal: 単発
    tier: body
    prompt: "distant explosion, deep low boom with a long rumbling tail, powerful far-off blast, cinematic, single event"
    negative_prompt: "music, speech, thin tinny, clipping"

  # ── 診断プローブ（本体カバー率に入れない・別報告）──
  - id: design_magic_cast
    idx: 7
    scene_ja: 魔法の発動（チャージ→放出）
    source: デザインSE
    temporal: 単発〜継続
    tier: diagnostic
    prompt: "magical spell casting, energy charging up then releasing in a bright burst, shimmering whoosh, fantasy designed sound effect"
    negative_prompt: "music, speech, realistic field recording, distortion"

  - id: design_transform_sparkle   # 任意（⑧）
    idx: 8
    scene_ja: 変身の「キラーン」
    source: デザインSE
    temporal: 単発
    tier: diagnostic
    prompt: "magical transformation sparkle, bright shimmering chime and ascending twinkle, fantasy designed sound effect"
    negative_prompt: "music, speech, distortion, clipping"
